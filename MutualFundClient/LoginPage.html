<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign in | Mutual Fund Portal</title><link rel="stylesheet" href="../styles.css"></head><body><main class="page-shell"><div class="brandbar"><a class="brand" href="../index.html"><span class="brand-mark">SB</span> Skill Bridge</a><span class="muted">Client portal</span></div><section class="page-card"><p class="eyebrow">Secure workspace</p><h1>Welcome back.</h1><p>Sign in to continue to your investor dashboard.</p><form id="loginForm" class="stack" style="margin-top:30px"><label>Username<input type="text" id="username" name="username" placeholder="admin" required></label><label>Password<input type="password" id="password" name="password" placeholder="password" required></label><button class="btn" type="submit">Enter portal</button><p class="status">Demo access: <strong>admin</strong> / <strong>password</strong></p></form></section></main><script>const defaultUsername='admin';const defaultPassword='password';document.getElementById('loginForm').addEventListener('submit',event=>{event.preventDefault();if(document.getElementById('username').value===defaultUsername&&document.getElementById('password').value===defaultPassword){window.location.href='MFClientPortal.html';}else{alert('Invalid username or password. Please try again.');}});</script></body></html>
