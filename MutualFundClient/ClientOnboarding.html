<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Investor onboarding | Mutual Fund Portal</title><link rel="stylesheet" href="../styles.css"></head><body><main class="page-shell"><div class="brandbar"><a class="brand" href="../index.html"><span class="brand-mark">SB</span> Skill Bridge</a><span class="muted">Step 1 of 2 · Investor onboarding</span></div><section class="page-card"><p class="eyebrow">New investor</p><h1>Tell us about yourself.</h1><p>Complete the details below to create your investor profile.</p><form id="investorForm" class="stack" style="margin-top:30px"><label>Full name<input type="text" id="fullName" class="required-field" required></label><label>Email<input type="email" id="email" class="required-field" required></label><div class="practice-grid"><label>Date of birth<input type="date" id="dob" class="required-field" required></label><label>Investment amount<input type="number" id="investmentAmount" min="0" step="100" class="required-field" required></label></div><fieldset class="panel"><legend>Gender</legend><div class="choice-row"><label><input type="radio" name="gender" value="male" required> Male</label><label><input type="radio" name="gender" value="female" required> Female</label></div></fieldset><label>Document type<select id="documentType" required><option value="" selected disabled>Select document type</option><option>Passport</option><option>Aadhar Card</option><option>Driver's License</option></select></label><label>Investment type<select id="investmentType" required><option value="" selected disabled>Select investment type</option><option>Equity</option><option>Debt</option><option>Hybrid</option></select></label><label>Preferred sectors<select id="preferredSectors" multiple><option>Technology</option><option>Finance</option><option>Healthcare</option><option>Energy</option></select></label><button class="btn" type="submit">Review details</button></form></section></main><div id="referencePopup" class="modal"><div class="modal-content"><p class="eyebrow">Profile ready</p><h2>Details confirmed</h2><p>Your investor reference is <strong id="referenceNumber"></strong>.</p><p>Continue to your portfolio or make an edit.</p><div class="choice-row"><button class="btn" onclick="proceedWithInvestment()">Proceed</button><button class="btn secondary" onclick="editDetails()">Edit details</button></div></div></div><script>document.getElementById('investorForm').addEventListener('submit',event=>{event.preventDefault();const form=event.currentTarget;if(!form.checkValidity()){form.reportValidity();return;}document.getElementById('referenceNumber').textContent=generateReference();document.getElementById('referencePopup').classList.add('active');});function generateReference(){return Math.random().toString(36).slice(2,12).toUpperCase();}function proceedWithInvestment(){alert('Thank you for confirming your details. You can now proceed with your investment.');const portfolioTab=window.open('portfolio.html','_blank');if(portfolioTab){portfolioTab.document.write('<title>Mutual Fund Portfolio</title><link rel="stylesheet" href="../styles.css"><main class="page-shell"><section class="page-card"><p class="eyebrow">Your portfolio</p><h1>Start building.</h1><p>Your empty portfolio is ready for its first investment.</p><h3>Available funds</h3><ul><li>Fund A</li><li>Fund B</li><li>Fund C</li></ul></section></main>');portfolioTab.document.close();}closeModal();}function editDetails(){closeModal();}function closeModal(){document.getElementById('referencePopup').classList.remove('active');}</script></body></html>
