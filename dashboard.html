<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinVerse Wealth Portal | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f8fafc;
        --navy: #0f172a;
        --blue: #2563eb;
        --muted: #64748b;
        --white: #ffffff;
        --border: #e2e8f0;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background: linear-gradient(180deg, #f8fafc 0%, #eef4ff 100%);
        color: var(--navy);
      }
      .dashboard-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }
      .dashboard-card {
        width: min(760px, 100%);
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
        padding: 40px 32px;
      }
      .tag {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(37, 99, 235, 0.1);
        color: var(--blue);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 18px 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: -0.06em;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 1rem;
      }
      .details {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
      }
      .detail-box {
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #f8fafc;
      }
      .detail-box span {
        display: block;
        color: var(--muted);
        font-size: 0.82rem;
        margin-bottom: 8px;
      }
      .detail-box strong {
        font-size: 1.2rem;
      }
      .logout {
        display: inline-block;
        margin-top: 26px;
        background: var(--navy);
        color: #fff;
        padding: 12px 20px;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="dashboard-shell">
      <div class="dashboard-card">
        <span class="tag">FinVerse</span>
        <h1>Welcome to your wealth dashboard</h1>
        <p id="welcome-message">Loading session...</p>

        <div class="details">
          <div class="detail-box">
            <span>Access Role</span>
            <strong id="user-role">-</strong>
          </div>
          <div class="detail-box">
            <span>Portfolio Value</span>
            <strong>$2.4M</strong>
          </div>
          <div class="detail-box">
            <span>Performance</span>
            <strong>+8.4%</strong>
          </div>
        </div>

        <a class="logout" href="index.html">Return to Login</a>
      </div>
    </div>

    <script>
      const session = JSON.parse(localStorage.getItem('finverse-user-session') || '{}');
      const welcomeMessage = document.getElementById('welcome-message');
      const userRole = document.getElementById('user-role');

      if (session.username && session.role) {
        welcomeMessage.textContent = 'Good evening, ' + session.username + '. Your portfolio is ready.';
        userRole.textContent = session.role;
      } else {
        welcomeMessage.textContent = 'Session not found. Please sign in again.';
        userRole.textContent = 'Not available';
      }
    </script>
  </body>
</html>
